<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora – Calendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf9f3;
    --cell: #fffdfa;
    --ink: #2f2f2f;
    --muted: #a3a3a0;
    --line: #2f2f2f;
    --today: #d9534f;
    --today-ink: #ffffff;
    --pick: #d5f2dc;
    --panel: #3a7d65;
    --panel-ink: #ffffff;
    --panel-soft: rgba(255, 255, 255, 0.78);
    --disabled-bg: rgba(255, 255, 255, 0.18);
    --display: 'Anton', 'Impact', 'Arial Narrow', sans-serif;
    --body: 'Helvetica Neue', Helvetica, Arial, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1b;
      --cell: #262624;
      --ink: #f1eee8;
      --muted: #77776f;
      --line: #f1eee8;
      --today: #e2605c;
      --pick: #2c4a3b;
      --panel: #2f6b55;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1b;
    --cell: #262624;
    --ink: #f1eee8;
    --muted: #77776f;
    --line: #f1eee8;
    --today: #e2605c;
    --pick: #2c4a3b;
    --panel: #2f6b55;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    min-height: 100vh;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }

  /* ---------- Encabezado ---------- */
  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .month-title {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(52px, 13vw, 132px);
    line-height: 0.95;
    letter-spacing: 0.01em;
    margin: 0;
    text-transform: uppercase;
  }
  .head-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .year {
    font-family: var(--display);
    font-size: clamp(40px, 9vw, 96px);
    line-height: 0.95;
    color: var(--muted);
  }
  .arrow-mark { width: clamp(22px, 4vw, 40px); height: auto; color: var(--muted); flex: none; }

  /* ---------- Navegación de meses ---------- */
  .nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .nav-btn {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--cell);
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    padding: 9px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--cell);
    color: var(--ink);
    font: 600 14px var(--body);
    cursor: pointer;
  }
  .tab[aria-current="true"] {
    background: var(--ink);
    color: var(--bg);
  }

  /* ---------- Distribución ---------- */
  .layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 920px) {
    .layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  }

  /* ---------- Calendario ---------- */
  .dow, .grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
  }
  .dow { margin-bottom: 8px; }
  .dow span {
    text-align: center;
    font-weight: 700;
    font-size: 14px;
  }
  .day {
    position: relative;
    min-height: 92px;
    padding: 8px 10px;
    text-align: left;
    background: var(--cell);
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font: 400 15px var(--body);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .day:hover { background: var(--pick); }
  .day.out { color: var(--muted); border-color: var(--muted); }
  .day.out:disabled { cursor: default; background: transparent; opacity: 0.55; }
  .day.picked { background: var(--pick); box-shadow: 0 0 0 2px var(--panel); }
  .day-num {
    min-width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    padding: 0 6px;
  }
  .day.today .day-num { background: var(--today); color: var(--today-ink); font-weight: 700; }
  .day-notes { margin-top: 6px; width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .day:focus-visible, .tab:focus-visible, .nav-btn:focus-visible, .add-btn:focus-visible {
    outline: 3px solid var(--panel);
    outline-offset: 2px;
  }

  /* ---------- Panel lateral ---------- */
  .panel {
    background: var(--panel);
    color: var(--panel-ink);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px 24px;
    min-height: 260px;
  }
  .panel h2 {
    font: 400 30px/1.05 var(--display);
    letter-spacing: 0.01em;
    margin: 0 0 4px;
    text-transform: capitalize;
  }
  .panel .sub { margin: 0 0 18px; color: var(--panel-soft); font-size: 14px; }
  .panel p { margin: 0 0 14px; line-height: 1.5; font-size: 15px; }
  .add-btn {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1.5px dashed var(--panel-ink);
    background: var(--disabled-bg);
    color: var(--panel-ink);
    font: 600 14px var(--body);
    cursor: pointer;
  }
  .add-btn:hover { background: rgba(255, 255, 255, 0.3); }

  .btn {
    padding: 7px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--panel-ink);
    background: transparent;
    color: var(--panel-ink);
    font: 600 13px var(--body);
    cursor: pointer;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.18); }
  .btn.solid { background: #ffffff; color: #2f2f2f; }
  .btn.solid:hover { background: #f1f1f1; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { background: #ffffff; color: #2f2f2f; }
  .btn:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }

  .badge {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1.5px solid var(--panel-soft);
    font: 600 11px var(--body);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    vertical-align: middle;
  }
  .check { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: #ffffff; }
  .note.done h3, .note.done p { text-decoration: line-through; opacity: 0.8; }
  .note-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .stack { display: grid; gap: 14px; margin-top: 8px; }

  .field label, .field .lbl { display: block; margin: 0 0 5px; font: 600 13px var(--body); }
  .field input[type="text"], .field textarea {
    width: 100%;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1.5px solid #2f2f2f;
    background: #fffdfa;
    color: #2f2f2f;
    font: 400 15px var(--body);
  }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.45; }
  .seg { display: flex; gap: 8px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 30px; height: 30px;
    border-radius: 999px;
    border: 2px solid #ffffff;
    cursor: pointer;
    padding: 0;
  }
  .swatch[aria-pressed="true"] { outline: 3px solid #ffffff; outline-offset: 2px; }
  .swatch:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
  .warn { color: var(--today); font-weight: 600; }

  .chip.done { text-decoration: line-through; opacity: 0.7; }
  .chip {
    display: block;
    width: 100%;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .note { margin: 0 0 18px; padding-top: 14px; border-top: 1.5px solid var(--panel-soft); }
  .note:first-of-type { border-top: 0; padding-top: 0; }
  .note h3 { margin: 0 0 8px; font: 700 16px var(--body); }
  .note p { white-space: pre-line; }
  @media (min-width: 920px) {
    .panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  }

  .foot-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
  .foot-row .foot { margin: 0; }
  .export-btn {
    padding: 9px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--cell);
    color: var(--ink);
    font: 600 14px var(--body);
    cursor: pointer;
  }
  .export-btn:hover { background: var(--pick); }
  .export-btn:focus-visible { outline: 3px solid var(--panel); outline-offset: 2px; }

  .session { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .session-btn {
    padding: 6px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--cell);
    color: var(--ink);
    font: 600 13px var(--body);
    cursor: pointer;
  }
  .session-btn:hover { background: var(--pick); }
  .session-btn:focus-visible { outline: 3px solid var(--panel); outline-offset: 2px; }

  .login-page {
    --login: #2f4b7c;
    --login-ink: #2f4b7c;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .center-card { width: 100%; max-width: 380px; text-align: center; }
  .login-title {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(56px, 16vw, 110px);
    line-height: 0.95;
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .login-sub { color: var(--muted); margin: 0 0 40px; font-size: 15px; }
  .login-box { text-align: center; }
  .login-box label {
    display: block;
    text-align: center;
    font: 700 13px var(--body);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--login-ink);
    margin-bottom: 6px;
  }
    .login-box input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 26px;
    border: 0;
    border-bottom: 3px solid var(--login);
    border-radius: 14px 14px 0 0;
    background: color-mix(in srgb, var(--login) 22%, transparent);
    color: var(--ink);
    text-align: center;
    font: 400 22px var(--body);
    letter-spacing: 0.2em;
    outline: none;
    transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .login-box input::placeholder {
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 0.08em;
  }
  .login-box input:focus {
    background: color-mix(in srgb, var(--login) 34%, transparent);
    border-bottom-color: var(--today);
    box-shadow: 0 6px 22px color-mix(in srgb, var(--login) 55%, transparent);
  }
  .login-box .btn.solid {
    width: 100%;
    padding: 13px 14px;
    font-size: 15px;
    border-radius: 999px;
    border: 0;
    background: var(--login);
    color: #ffffff;
  }
  .login-box .btn.solid:hover { background: #3d5e99; }
  .login-box .btn.solid:focus-visible { outline: 3px solid var(--login); outline-offset: 3px; }
  .login-msg { margin: 14px 0 0; font-size: 14px; line-height: 1.45; font-weight: 600; }
  .panel-error {
    margin: 14px 0 0;
    padding: 9px 11px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.3);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  .note .note-fecha { margin: -2px 0 10px; font-size: 12px; opacity: 0.85; }
  .coments { margin: 14px 0 4px; padding-top: 12px; border-top: 1.5px dashed var(--panel-soft); }
  .coments h4 { margin: 0 0 8px; font: 700 12px var(--body); letter-spacing: 0.06em; text-transform: uppercase; }
  .coment { background: rgba(0, 0, 0, 0.22); border-radius: 10px; padding: 9px 11px; margin: 0 0 8px; }
  .coment-meta { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
  .coments .coment-texto { margin: 0; white-space: pre-line; font-size: 14px; line-height: 1.45; text-decoration: none; opacity: 1; }
  .coments textarea {
    width: 100%;
    min-height: 84px;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1.5px solid #2f2f2f;
    background: #fffdfa;
    color: #2f2f2f;
    font: 400 14px var(--body);
    line-height: 1.4;
    resize: vertical;
  }
  .coment-nuevo { margin-top: 10px; }
  .state-msg { text-align: center; color: var(--muted); margin: 18vh auto 0; max-width: 420px; line-height: 1.5; }
  .state-msg .btn { color: var(--ink); border-color: var(--line); margin: 6px 4px 0; }

  .foot { margin-top: 22px; font-size: 13px; color: var(--muted); }

  @media (max-width: 640px) {
    .page { padding: 20px 12px 32px; }
    .grid, .dow { gap: 5px; }
    .day { min-height: 58px; padding: 5px 6px; border-radius: 9px; font-size: 13px; }
    .day-num { min-width: 22px; height: 22px; padding: 0 4px; }
    .dow span { font-size: 12px; }
    .chip { height: 6px; padding: 0; font-size: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function () {
  var h = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;

  // ================= CONFIGURACIÓN (lo único que tienes que editar) =================
  // Los dos valores están en Supabase: botón "Connect" del proyecto.
  // Usa la URL del proyecto y la llave PÚBLICA (publishable / anon). NUNCA la secret / service_role.
  var SUPABASE_URL = 'https://akmfzyskwsjfxyljrlxp.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_gtqVCds_qlG-znxEp4RRpg_QzaGL3y_';
  var CAMILA_EMAIL = 'camila@bitacora.app';
  var PROFESOR_EMAIL = 'profesor@bitacora.app';
  // ====================================================================================

  var YEAR = 2026;
  var MONTHS = [
    { i: 7,  name: 'August',    short: 'Aug' },
    { i: 8,  name: 'September', short: 'Sep' },
    { i: 9,  name: 'October',   short: 'Oct' },
    { i: 10, name: 'November',  short: 'Nov' },
    { i: 11, name: 'December',  short: 'Dec' }
  ];
  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var COLORES = ['#e0951a', '#cf4a1f', '#3a7d65', '#a65d1a', '#0097b2', '#2b8cf0', '#c96ae8'];

  // ---------- Conexión con Supabase ----------
  var configurado = SUPABASE_URL.indexOf('https://') === 0 && SUPABASE_KEY.indexOf('PEGA_AQUI') !== 0;
  var client = null;
  var errorInicio = '';
  if (configurado) {
    try { client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
    catch (e) { errorInicio = 'No se pudo iniciar la conexión con Supabase. Revisa que la URL y la llave estén bien copiadas.'; }
  }

  function rolDe(email) {
    var e = String(email || '').toLowerCase();
    if (e === CAMILA_EMAIL) return 'camila';
    if (e === PROFESOR_EMAIL) return 'profesor';
    return null;
  }

  function aNota(fila) {
    return {
      id: fila.id,
      fecha: String(fila.fecha).slice(0, 10),
      titulo: fila.titulo,
      tipo: fila.tipo,
      color: fila.color,
      texto: fila.texto || '',
      hecha: !!fila.hecha,
      creada_en: fila.creada_en,
      actualizada_en: fila.actualizada_en
    };
  }

  function aComentario(fila) {
    return { id: fila.id, nota_id: fila.nota_id, texto: fila.texto || '', creado_en: fila.creado_en };
  }

  function formatoFecha(iso) {
    try {
      return new Date(iso).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  // "Creada: ... · Editada: ..." (Editada solo aparece si el contenido se cambió después).
  function fechasDe(n) {
    if (!n.creada_en) return '';
    var txt = 'Creada: ' + formatoFecha(n.creada_en);
    if (n.actualizada_en && (new Date(n.actualizada_en) - new Date(n.creada_en)) > 1000) {
      txt += ' \u00B7 Editada: ' + formatoFecha(n.actualizada_en);
    }
    return txt;
  }

  // Orden estable por fecha: las notas del mismo día conservan su orden de creación.
  function ordenar(notas) {
    return notas.slice().sort(function (a, b) {
      return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0);
    });
  }

  function agruparPorDia(notas) {
    var mapa = {};
    notas.forEach(function (n) {
      if (!mapa[n.fecha]) mapa[n.fecha] = [];
      mapa[n.fecha].push(n);
    });
    return mapa;
  }

  function credencialInvalida(err) {
    return err && (err.status === 400 || /invalid login credentials/i.test(err.message || ''));
  }

  function sesionVencida(e) {
    return e && (e.status === 401 || /jwt/i.test(e.message || ''));
  }

  // Prueba el código con las dos cuentas; Supabase decide en su servidor cuál es la correcta.
  function entrarConCodigo(codigo) {
    var cuentas = [PROFESOR_EMAIL, CAMILA_EMAIL];
    function intento(i) {
      if (i >= cuentas.length) return Promise.resolve({ ok: false });
      return client.auth.signInWithPassword({ email: cuentas[i], password: codigo }).then(function (r) {
        if (r && !r.error && r.data && r.data.session) return { ok: true, email: cuentas[i] };
        if (r && r.error && !credencialInvalida(r.error)) return { ok: false, conexion: true };
        return intento(i + 1);
      });
    }
    return intento(0).catch(function () { return { ok: false, conexion: true }; });
  }

  // Trae notas y comentarios juntos.
  function traerTodo() {
    return Promise.all([
      Promise.resolve(
        client.from('notas').select('*')
          .order('fecha', { ascending: true })
          .order('creada_en', { ascending: true })
      ),
      Promise.resolve(
        client.from('comentarios').select('*').order('creado_en', { ascending: true })
      )
    ]).then(function (rs) {
      if (rs[0].error) throw rs[0].error;
      if (rs[1].error) throw rs[1].error;
      return {
        notas: (rs[0].data || []).map(aNota),
        comentarios: (rs[1].data || []).map(aComentario)
      };
    });
  }

  // ---------- Fechas ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function sameDay(a, b) { return a && b && keyOf(a) === keyOf(b); }

  function buildCells(year, month) {
    var offset = new Date(year, month, 1).getDay();
    var total = new Date(year, month + 1, 0).getDate();
    var rows = Math.ceil((offset + total) / 7);
    var cells = [];
    for (var i = 0; i < rows * 7; i++) cells.push(new Date(year, month, 1 - offset + i));
    return cells;
  }

  function monthIndexOf(d) {
    if (d.getFullYear() !== YEAR) return -1;
    for (var i = 0; i < MONTHS.length; i++) if (MONTHS[i].i === d.getMonth()) return i;
    return -1;
  }

  function startIndex() {
    var idx = monthIndexOf(new Date());
    return idx < 0 ? 0 : idx;
  }

  // ---------- Componentes ----------
  function Header(props) {
    return h('header', { className: 'head' },
      h('h1', { className: 'month-title' }, props.month.name),
      h('div', { className: 'head-right' },
        h('svg', { className: 'arrow-mark', viewBox: '0 0 24 24', 'aria-hidden': 'true' },
          h('path', { d: 'M4 4h11v4H9.8l10.2 10.2-2.8 2.8L7 10.8V16H3V4z', fill: 'currentColor' })
        ),
        h('span', { className: 'year' }, YEAR)
      )
    );
  }

  function Nav(props) {
    return h('nav', { className: 'nav', 'aria-label': 'Meses' },
      h('button', {
        className: 'nav-btn', 'aria-label': 'Mes anterior',

    }

    // ----- Escritura en la base (solo la cuenta de Camila puede; lo verifica Supabase) -----
    // Devuelve { ok: true, data } o { ok: false, mensaje }.
    function ejecutar(consulta, falloTexto) {
      return Promise.resolve(consulta).then(function (res) {
        if (res.error) throw res.error;
        if (!res.data || res.data.length === 0) throw { sinFilas: true };
        return { ok: true, data: res.data };
      }).catch(function (e) {

      return h('div', { className: 'page' }, h('p', { className: 'state-msg', role: 'status' }, 'Cargando...'));
    }
    if (estado === 'login') {
      return h(Login, { onEntrar: onEntrar, aviso: aviso });
    }
    if (estado === 'error') {
      return h('div', { className: 'page' },
        h('div', { className: 'state-msg' },
          h('p', null, aviso),
          h('button', { className: 'btn', onClick: function () { setEstado('cargando'); cargarNotas(); } }, 'Reintentar'),
          h('button', { className: 'btn', onClick: salir }, 'Salir')
        )
      );
    }

    var porDia = agruparPorDia(notas);
    var puedeEscribir = rol === 'camila';
    var comentariosPorNota = {};
    comentarios.forEach(function (c) {
      if (!comentariosPorNota[c.nota_id]) comentariosPorNota[c.nota_id] = [];
      comentariosPorNota[c.nota_id].push(c);
    });
    return h('div', { className: 'page' },
      h('div', { className: 'session' },
        avisoRefresco ? h('span', { className: 'warn', role: 'status' }, avisoRefresco) : null,
        h('span', null, rol === 'camila' ? 'Sesión: Camila' : 'Sesión: Profesor'),
        h('button', { className: 'session-btn', disabled: refrescando, onClick: refrescar }, refrescando ? 'Actualizando...' : 'Actualizar'),
        h('button', { className: 'session-btn', onClick: salir }, 'Salir')
      ),
      h(Header, { month: MONTHS[pos] }),
      h(Nav, { pos: pos, onGo: setPos }),
      h('div', { className: 'layout' },
        h(Calendar, { pos: pos, selected: selected, porDia: porDia, comentarios: comentariosPorNota, onPick: pick }),
        h(Panel, {
          key: selected ? keyOf(selected) : 'ninguno',
          selected: selected,
          notas: selected ? (porDia[keyOf(selected)] || []) : [],
          puedeEscribir: puedeEscribir,
          esProfesor: rol === 'profesor',
          comentarios: comentariosPorNota,
          onCrear: crearNota, onActualizar: actualizarNota, onBorrar: borrarNota,
          onCrearComentario: crearComentario, onActualizarComentario: actualizarComentario, onBorrarComentario: borrarComentario
        })
      ),
      h('p', { className: 'foot' },
        puedeEscribir
          ? 'Tus cambios se guardan en la base de datos. Pulsa Actualizar para ver comentarios nuevos.'
          : 'Estás viendo la bitácora de Camila: puedes dejar comentarios en sus notas.')
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
